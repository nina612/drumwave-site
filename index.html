<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrumWave: Your life creates data</title>
<meta name="description" content="Your life creates data. What if its value grew with you?">
<!-- This file used to be the whole one-file site; that design is retired.
     The two live pages are sept-3.html (Personal) and sept-8.html (Business),
     cross-linked to each other through their own nav bars. This is just the
     front door: redirect straight to the Personal page so the root GitHub
     Pages link lands somewhere real. Meta refresh covers no-JS clients (and
     search engines, which follow it as a redirect); the script covers
     everyone else with no flash of this page. -->
<meta http-equiv="refresh" content="0; url=sept-3.html">
<!-- The query and hash are carried across, which the meta refresh above cannot do.
     GitHub Pages serves these files with cache-control: max-age=600 and no way to
     set a header, so a phone that has the page cached is the normal way a change
     fails to show up. Appending ?anything to this link is the reliable way to force
     a fresh copy - and without this line the redirect dropped it, so the short link
     could not be busted at all. -->
<script>location.replace('sept-3.html' + location.search + location.hash);</script>
<style>html{background:#070707}</style>
</head>
<body>
<p><a href="sept-3.html">Continue to the site</a></p>
</body>
</html>
