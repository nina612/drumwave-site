<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dWallet — why isn't the hero animating?</title>
<style>
 body{margin:0;padding:20px 18px 40px;background:#070707;color:#F3F2EE;
   font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
 h1{font-size:19px;margin:0 0 4px} .sub{color:#888;font-size:13px;margin:0 0 22px}
 .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
   border-bottom:1px solid rgba(255,255,255,.09)}
 .k{color:#999;font-size:13px} .v{font-weight:600;text-align:right}
 .bad{color:#ff6b6b} .good{color:#5be26b} .wait{color:#e8c95b}
 #verdict{margin:24px 0 0;padding:14px;border-radius:10px;background:rgba(255,255,255,.06);font-size:14px}
 iframe{width:100%;height:210px;border:1px solid rgba(255,255,255,.15);border-radius:10px;margin-top:20px}
 a{color:#6aa8ff;display:inline-block;margin-top:14px}
</style></head><body>
<h1>Hero diagnostic</h1>
<p class="sub">Loads the real page below and reports what your phone does with it.</p>
<div id="rows"></div>
<div id="verdict" class="wait">Testing… give it about six seconds.</div>
<iframe id="f" src="sept-3.html?hero=2" title="hero under test"></iframe>
<a href="sept-3.html?hero=2&motion=on">Open v2 with motion forced on →</a>
<script>
var rows = [], rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function put(k, v, bad){ rows.push('<div class="row"><span class="k">'+k+
  '</span><span class="v '+(bad?'bad':'good')+'">'+v+'</span></div>');
  document.getElementById('rows').innerHTML = rows.join(''); }
put('Reduced motion reported', rm ? 'YES' : 'no', rm);
put('Viewport', innerWidth+'×'+innerHeight, false);
put('svh supported', (window.CSS && CSS.supports && CSS.supports('height','100svh')) ? 'yes' : 'NO', !(window.CSS&&CSS.supports&&CSS.supports('height','100svh')));
var f = document.getElementById('f');
f.onload = function(){
  var w = f.contentWindow, d = f.contentDocument;
  setTimeout(function(){
    var err = w.__heroErr;
    put('Build', w.__heroBuild || 'unknown (stale cache?)', !w.__heroBuild);
    put('GSAP loaded', w.gsap ? 'yes' : 'NO', !w.gsap);
    put('ScrollTriggers built', w.ScrollTrigger ? w.ScrollTrigger.getAll().length : 0,
        !w.ScrollTrigger || w.ScrollTrigger.getAll().length < 2);
    put('Script error', err ? err : 'none', !!err);
    var fr = d.querySelectorAll('#act1 > .frame, #act2 .frame');
    var a = [].map.call(fr, function(x){ return w.getComputedStyle(x).opacity; }).join();
    setTimeout(function(){
      var b = [].map.call(fr, function(x){ return w.getComputedStyle(x).opacity; }).join();
      var moving = a !== b;
      put('Photographs changing', moving ? 'yes' : 'NO', !moving);
      var v = document.getElementById('verdict');
      if (err) { v.className='bad'; v.textContent = 'The page is throwing an error: ' + err + ' — send me this line.'; }
      else if (!w.gsap) { v.className='bad'; v.textContent = 'GSAP did not load — the animation library is missing or blocked.'; }
      else if (rm) { v.className='bad'; v.textContent = 'Your phone reports Reduced Motion, so the hero is frozen on purpose. Check Settings > Battery > Low Power Mode and Settings > Accessibility > Motion > Reduce Motion. The link below bypasses it.'; }
      else if (!moving) { v.className='bad'; v.textContent = 'No error, GSAP loaded, reduced motion off — but the photographs are not changing. Send me this screen.'; }
      else { v.className='good'; v.textContent = 'The hero IS animating here. If the full page looks static, it is likely a cached copy — pull to refresh, or add ?v=99 to the link.'; }
    }, 3500);
  }, 2500);
};
</script></body></html>
